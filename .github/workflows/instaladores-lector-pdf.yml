# Fabrica los instaladores de escritorio del Lector PDF y los publica en una
# «release» del repositorio (ADR-0044). Solo se ejecuta a mano, para no gastar
# minutos de GitHub Actions en cada push. macOS es opcional porque cuesta 10 veces más.
name: Instaladores Lector PDF

on:
  workflow_dispatch:
    inputs:
      sistemas:
        description: Sistemas para los que fabricar el instalador
        type: choice
        default: windows
        options:
          - windows
          - windows y linux
          - windows, linux y macos

permissions:
  contents: write

concurrency:
  group: instaladores-lector-pdf
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        run: |
          win='{"os":"windows-latest","bundles":"nsis"}'
          lin='{"os":"ubuntu-22.04","bundles":"deb,appimage"}'
          mac='{"os":"macos-latest","bundles":"dmg"}'
          case "${{ inputs.sistemas }}" in
            "windows y linux") list="[$win,$lin]" ;;
            "windows, linux y macos") list="[$win,$lin,$mac]" ;;
            *) list="[$win]" ;;
          esac
          echo "include=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm (versión del packageManager)
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: Rust estable
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # La caché de Rust es lo que más ahorra: la segunda fabricación tarda una fracción de la primera.
      - uses: Swatinem/rust-cache@v2
        with:
          key: lector-pdf

      - name: Librerías del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile
        shell: bash

      - name: Fabricar el instalador
        shell: bash
        run: pnpm --filter lector-pdf tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: lector-pdf-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg

  release:
    needs: build
    # Publica lo que se haya fabricado aunque falle otro sistema.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - name: Publicar en la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Nombre fijo para Windows: el enlace .../releases/latest/download/Instalar-Lector-PDF.exe no cambia entre versiones.
          # El artefacto conserva las subcarpetas (nsis/, deb/…): se aplanan antes de subir.
          find instaladores -mindepth 2 -type f -exec mv -t instaladores {} +
          find instaladores -mindepth 1 -type d -empty -delete
          for f in instaladores/*-setup.exe; do mv "$f" instaladores/Instalar-Lector-PDF.exe; done
          files=(instaladores/*)
          ls -la instaladores
          if [ ${#files[@]} -eq 0 ]; then echo "No hay instaladores que publicar"; exit 1; fi
          version=$(node -p "require('./apps/lector-pdf/src-tauri/tauri.conf.json').version")
          tag="lector-pdf-v$version"
          notes="Instaladores del Lector PDF $version fabricados a partir de ${GITHUB_SHA::7}.

          - Windows: descarga Instalar-Lector-PDF.exe y ábrelo con doble clic. Si aparece «Windows protegió su PC», pulsa Más información › Ejecutar de todas formas (el instalador no está firmado).
          - Linux: el .deb se instala con sudo apt install ./archivo.deb; el AppImage funciona con doble clic.
          - macOS: abre el .dmg y arrastra Lector PDF a Aplicaciones."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --latest \
              --title "Lector PDF $version" --notes "$notes"
          fi
