[package]
name = "lector-pdf"
version = "0.1.0"
description = "Lector PDF de la suite ofimática"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "lector_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
suite-platform = { path = "../../../packages/platform/rust", features = ["tauri"] }

