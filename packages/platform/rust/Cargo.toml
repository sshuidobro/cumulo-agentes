[package]
name = "suite-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "suite_platform"

[features]
default = []
tauri = ["dep:tauri", "dep:tauri-plugin-dialog"]

[dependencies]
tauri = { version = "=2.12.4", optional = true }
tauri-plugin-dialog = { version = "=2.8.3", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
